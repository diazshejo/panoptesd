# Configuracion de ejemplo para panoptesd.
# Copiar a /etc/panoptesd/config.toml y ajustar segun el servidor.

# Intervalo de polling, en segundos. Valores mas bajos detectan mas rapido
# pero consumen mas CPU; 5s es un buen balance para un server de proposito
# general.
poll_interval_secs = 5

# Nivel de log: "trace" | "debug" | "info" | "warn" | "error"
log_level = "info"

# Archivo de log adicional (ademas de stdout, que systemd captura en
# journald). Comentar/omitir para loguear solo a stdout.
log_file = "/var/log/panoptesd/panoptesd.log"

# Script bash que se ejecuta ante cada anomalia detectada.
audit_script_path = "/opt/panoptesd/scripts/auditoria.sh"

# Cooldown desde la confirmacion de Telegram (o registro local si esta
# deshabilitado). Clave: PID+inicio+tipo; root por contexto; host independiente.
# Fallo de envio/cola llena no consume cooldown.
cooldown_secs = 300

# Hilos del pool que ejecutan el script de auditoria (no bloquean el loop
# de monitoreo). 2 alcanza para la mayoria de los casos.
script_worker_threads = 2
# Limita cada auditoria y termina sus auxiliares al finalizar.
audit_timeout_secs = 30

[rules.cpu]
enabled = true
# %CPU (puede superar 100 en procesos multi-hilo/multi-core).
threshold_percent = 85.0
# Debe mantenerse sostenido por esta cantidad de segundos (no un pico).
sustained_secs = 60

[rules.memory]
enabled = true
# RSS por proceso, en MiB (no suma hijos ni swap). Ajustar al workload y
# memory.max del servicio. El valor anterior, 2048, supera la RAM del
# servidor de ~1.9 GiB mostrado en alertas .txt y no sirve como alarma pre-OOM.
max_rss_mb = 768

[rules.host_memory]
# Tambien habilitado por defecto si esta seccion se omite en configs antiguas.
enabled = true
# Alerta si MemAvailable cae por debajo de CUALQUIERA de estos umbrales.
# 0 desactiva solo ese umbral. Unidades MiB / porcentaje de MemTotal.
min_available_mb = 256
min_available_percent = 15.0
sustained_secs = 10
# Con polling=5: deteccion aprox. 10..15s tras comenzar la presion, mas envio.
# No garantiza anticipar OOM instantaneo ni un limite de cgroup menor al host.

[rules.root_whitelist]
enabled = true
# Agrupa auxiliares relacionados antes del primer aviso. 0 = sin espera.
group_window_secs = 10
# Herramientas con ejecutable root y sin escritura ajena deben persistir 10s.
# Rutas desconocidas/borradas/inaccesibles avisan sin esta espera.
# 0 restaura la deteccion inmediata tambien para herramientas del sistema.
sustained_secs = 10
# Se comprueban ruta exacta, propietario root y permisos de archivo/directorios.
# Estos valores tambien se usan si una configuracion anterior omite el campo.
# [] desactiva las excepciones por ejecutable. No incluir interpretes genericos.
allowed_executables = [
    "/usr/lib/systemd/systemd-executor", "/lib/systemd/systemd-executor",
    "/usr/bin/systemd-tty-ask-password-agent", "/bin/systemd-tty-ask-password-agent",
]
# Los integrantes quedan en log; grupos persistentes vuelven tras cooldown.
# No ampliar allowed_names con interpretes/herramientas genericas.
# Nombres de proceso (comm, tal como aparece en /proc/<pid>/stat, max 15
# caracteres del lado del kernel) permitidos para correr como root.
allowed_names = [
    "systemd",
    "sshd",
    "cron",
    "crond",
    "rsyslogd",
    "systemd-journal",
    "systemd-udevd",
    "systemd-logind",
    "dbus-daemon",
    "NetworkManager",
    "panoptesd",
]

[rules.ephemeral]
enabled = true
# Si un proceso vive menos de esta cantidad de segundos se considera
# sospechoso (posible cryptominer/malware que se relanza para evadir
# deteccion).
max_lifetime_secs = 2

[network]
# La correlacion de sockets recorre los fds de todos los procesos: es la
# regla mas costosa. Se deja deshabilitada por defecto. Habilita dos
# reglas independientes (ver README, seccion "Reglas de red"):
# nuevo_puerto_listen y conexion_saliente_no_esperada.
enabled = false
# Cada cuantos ciclos de polling se hace la correlacion (si esta habilitada).
check_every_n_cycles = 6

# --- conexion_saliente_no_esperada (TCP ESTABLISHED, solo IPv4) ---
# Solo evalua conexiones SALIENTES: las entrantes (puerto local en
# allowed_listen_ports, < 1024, en LISTEN, o fuera del rango efimero del
# kernel) se descartan, asi un login por ssh desde una IP externa no
# dispara esta regla.
# Puertos remotos considerados normales (a cualquier IP).
allowed_remote_ports = [80, 443, 53, 123]
# Rangos IPv4 esperados (notacion CIDR). Conexiones fuera de estos rangos
# y de allowed_remote_ports se consideran anomalas.
allowed_cidrs_v4 = ["10.0.0.0/8", "192.168.0.0/16", "127.0.0.0/8"]

# --- nuevo_puerto_listen (tcp/tcp6/udp/udp6) ---
# Puertos locales en los que se espera que algo quede escuchando (ej el
# puerto de sshd o el de un servicio propio). Ajustar segun el servidor
# antes de habilitar: cualquier puerto no listado que aparezca en LISTEN
# despues del primer chequeo dispara la alerta.
allowed_listen_ports = [22]

[telegram]
# Habilita las tres notificaciones por Telegram: alerta inmediata de
# anomalia, status periodico y resumen semanal de auditoria.
#
# El token del bot y el chat_id NUNCA van en este archivo: se leen de las
# variables de entorno TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (ver
# systemd/panoptesd.service, EnvironmentFile). Si enabled=true pero las
# variables no estan seteadas, el daemon falla al iniciar con un error claro.
enabled = false

# Cada cuantas horas se envia el reporte de status (uptime, CPU, memoria,
# disco, procesos vigilados y anomalias de las ultimas 12h).
status_interval_hours = 12

# Dia y hora (UTC) del resumen semanal de auditoria. Dia en ingles,
# minusculas: "sunday", "monday", "tuesday", "wednesday", "thursday",
# "friday", "saturday".
weekly_summary_day = "sunday"
weekly_summary_hour = 23

# Particiones a reportar en el status periodico (uso de disco).
disk_paths = ["/"]

# Timeout (segundos) de las llamadas HTTP a la API de Telegram. Si se
# supera, las alertas se reintentan hasta 3 veces y queda el error en log.
# Las alertas de memoria tienen cola/hilo propios, separados de root y scripts.
# Un fallo no confirma cooldown; si persiste se reevalua en el siguiente polling.
request_timeout_secs = 5

[ssh_watch]
# Monitoreo de logins SSH exitosos en tiempo real. Es independiente del
# loop de /proc y de las reglas: lanza `journalctl -f -u <unit_name> -o cat`
# como subproceso y un hilo dedicado lee su stdout linea por linea
# (bloqueante, sin polling: no consume CPU cuando no hay eventos). Cada
# "Accepted password|publickey for <user> from <ip> port <port>" dispara
# una alerta 🔑 a Telegram al instante, SIN cooldown (un login exitoso es
# siempre relevante y poco frecuente). No pasa por el script de auditoria.
# Solo cubre logins exitosos: no intentos fallidos ni otros patrones.
# Requiere [telegram] enabled = true para que la alerta llegue; si no,
# los logins solo quedan en el log del daemon. Si journalctl muere
# (rotacion de journald, señal) se relanza solo tras unos segundos.
enabled = false
# Unit de systemd del servidor SSH: "ssh.service" en Debian/Ubuntu,
# "sshd.service" en Fedora/RHEL/Arch. Confirmar con `systemctl status ssh`
# o `systemctl status sshd` en el servidor.
unit_name = "ssh.service"
